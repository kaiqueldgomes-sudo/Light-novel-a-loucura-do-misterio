<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A loucura do mistério? — Light Novel</title>
<meta name="description" content="O garoto chamado Kevin e seus amigos enfrentam os problemas de Ginha e objetivos para impedir o fim do mundo.">
<style>
:root{--bg:#faf7f2;--surface:#fff;--text:#1f1b16;--muted:#6b6358;--accent:#b4442b;--line:#e6dfd3;--fs:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--surface:#1e1b16;--text:#ece6da;--muted:#a39a8a;--accent:#e8765a;--line:#322d25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--surface:#1e1b16;--text:#ece6da;--muted:#a39a8a;--accent:#e8765a;--line:#322d25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.7}
header{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto;padding:16px 20px}
header a{color:var(--text);text-decoration:none;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;font-size:14px;font-family:system-ui,sans-serif}
button{font:inherit;font-family:system-ui,sans-serif;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:8px 20px 56px}
.hero{padding:40px 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero h1{font-size:clamp(32px,9vw,54px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0;font-size:17px}
.tag{display:inline-block;color:var(--accent);font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
h2{font-size:14px;font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px}
.list a{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none}
.list a:hover{border-color:var(--accent)}
.list small{color:var(--muted);font-family:system-ui,sans-serif;white-space:nowrap}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}
.exit{margin-right:auto}
article h1{font-size:28px;line-height:1.25;margin:16px 0 24px}
article p{font-size:var(--fs);margin:0 0 1.1em}
nav.pn{display:flex;gap:8px;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
nav.pn a{flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;font-family:system-ui,sans-serif;font-size:14px}
nav.pn a.off{opacity:.35;pointer-events:none}
#app{transition:transform .28s ease,opacity .28s ease}
#app.leave{opacity:0;transform:translateX(calc(var(--d,1)*-48px))}
#app.enter{opacity:0;transform:translateX(calc(var(--d,1)*48px));transition:none}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
body{overflow-x:hidden}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 32px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<header><a href="#" id="home">A loucura do mistério?</a><button id="theme" aria-label="Alternar tema">Tema</button></header>
<main id="app"></main>
<footer>© Todos os direitos reservados ao autor</footer>
<script>
/* ===== ADICIONE SEUS CAPÍTULOS AQUI ===== */
var CHAPTERS = [
  {id:"prologo", title:"Prólogo — Passado de Kevin", date:"24/11/2026",
   body:[
    `Desde o nascimento de Kevin,a mãe dele o odiava porque não queria ter filhos,um certo tempo depois o pai de Kevin o abandona-os`,
    `-Eu vou ir embora dessa casa,eu não quero ter filhos sua vadia.Disse pai de Kevin`,
    `-Nao vá embora,eu não quero cuidar desse moleque sozinh-.Disse mãe de Kevin antes de pai de Kevin interromper ela fechando a porta.`,
    `Um dia depois a mãe de Kevin bota ele na adoção.Kevin passa 3 anos na adoção,sozinho,pos nenhuma criança queria ser amigo(a) dele.`,
    `Dave,a criança que o-maltatrava todo dia,foi mais uma vez pertuba-lo`,
    `-Eu,por quê você fica nesse canto sozinho?Aéeee,porque você não tem amigos!HAH-.`,
    `Kevin interrope a fala de Dave com um soco na cara.A tia,que se chama Mary,que viajava as crianças viu Kevin dar um soco em Dave,pegou a sua mão Direita e levou para o castigo de 1 dia.`,
    `Depois que Kevin passa pelo castigo,viu todas as crianças vir para cima dele gritando repentinamente`,
    `-Sozinho!Sozinho!`,
    `Quando as crianças pularam em cima de Kevin,ele se defendeu delas até levar um chute nas costas caindo no chão agarrado vendo Dave se aproximando dizendo:`,
    `-Uai?Cadê o Kevin que tinha me dado um soco?`,
    `Dave depois de disser isso da um chute nas pernas de Kevin,repetindo a mesma frase várias vezes para Kevin e chutando-o.`,
    `Kevin agarrado pelas crianças tenta gritar para Mary,Mas Dave porém tampa sua boca impedindo de gritar e tampa seu nariz impedindo de respirar,fazendo o desmaiar,Mary,porém viu que Kevin não estava acordado gritou:`,
    `-Kevin!`,
    `Mas Dave respondeu:`,
    `-Ele está dormindo!`,
    `E Mary acredita,pós estava quase na hora de dormir.`,
    `Kevin desacordado desperta na madrugada e ver que estava na hora de dormir porque toda as crianças estavam dormindo.`,
    `Com Ira,foi em direção de Dave,vendo que também tava dormindo, enforcou Dave até a Morte,depois foi dormir.`,
    `Quando acordou viu todas as crianças e Mary desesperadas pela morte de Dave.`,
    `Ninguém sabia quem o matou.Passado 1 ano,uma mulher chamada Jane,adotou Kevin e levou para casa e cuidou dele`,
    `-Que menino lindo!Qual seu nome?Disse Jane para Kevin`,
    `-Kevin.`,
    `-Que nome lindo!`,
    `E foi assim até a gosma preta chegar.`
   ]},
  {id:"cap-1", title:"Capítulo 1 — O começo da dor (Arco 1)", date:"24/11/2026",
   body:[
    `Tudo se começa com o protagonista chamando Kevin,que tava na sua rotina normal quando sentiu uma presença muito forte de um ser que,ele não sabia o que era,não sabia onde estava e muito menos quem era.No momento ele foi correndo para avisar sobre a presença quando derrepente`,
    `#BOOM#.Kevin é jogado contra a parede,e ver uma coisa surgindo no final da floresta,na cidade onde ele mora,derrepente uma gosma preta vai engolindo as árvores,vindo da direção de Kevin,ele foi correu junto das pessoas quando viu um buraquinho e entrou,escondido vendo as pessoas sendo devoradas pela gosma,enquanto ele ia mais pro fundo,ele viu  um cristal com uma luz muito forte,quase cegando Kevin.`,
    `A luz estava perdendo a cor cada vez que ele chegava mais perto,o cristal era uma bola que guardava uma coisa dentro mas tava fechado,num estante ela se abriu e tava uma gosma dentro em formato de cubo.`,
    `Kevin fala:`,
    `-O que é essa gosma branca?`,
    `Essa gosma era diferente que Kevin tinha visto,essa é branca e a outra preta.`,
    `Quando Kevin foi ver mais de perto a gosma pulou na cara de Kevin e no momento se juntou com o corpo de Kevin.`,
    `Kevin percebeu o diferencial na hora,ele tava mais forte,mais ágil e,com uma visão melhor que a de uma águia,e a gosma estava no braço Direito dele,podendo criar qualquer coisa que ele pensasse no braço.`,
    `Ele criou uma espada que cortou a caverna inteira e mais um pouco do pedaço da rua,Kevin viu o estrago que a gosma preta tinha feito,cheio de corpos humanos,cabeça,braço,perna...`
   ]},
  {id:"cap-2", title:"Capítulo 2 — O meio do amadurecimento (Arco 2)", date:"24/11/2026",
   body:[
    `Após Kevin ver os corpos mortos pela gosma preta vomita pelo nojo,ele vai para escola ver se te alguém vivo.`,
    `Kevin encontra uma garota,chorando assustada vendo os corpos das amigas desde infância mortos.Kevin vendo isso,acalma ela dizendo:`,
    `-Está tudo bem.`,
    `A garota se acalma e agradece Kevin`,
    `-Qual seu nome linda garota?Pergunta Kevin`,
    `Ela ri e diz`,
    `-Meu nome é Ana.`,
    `-E o seu?`,
    `-O meu é Kevin,prazer em te conhecer,agora eu tenho que te levar para um lugar seguro antes que seja tarde`,
    `Após dizer isso,Kevin pega a Ana no colo e vai levando ela balançando nos prédios quase destruídos.`,
    `Depois de levá-la para uma casa qualquer,deixa ela dizendo:`,
    `-Se cuida!`,
    `Chegando na casa de Jane,ficou assustado após ver Jane toda machucada e sem o braço Direito,Kevin correu em direção de Jane quando derrepente a gosma vai em direção onde estava o braço Direito de Jane e cria outro braço.`,
    `Jane fica surpresa ao ver seu braço Direito ser restaurado e agradece Kevin pelo milagre,Kevin diz:`,
    `-Mas eu não fiz isso,foi sem querer`,
    `Mas Jane não liga e continua agradecendo.`,
    `Kevin nomeia essa gosma branca de Hagi,mas não sabe o real nome da gosma.`,
    `Kevin pergunta pra Jane o que houve para ela estar toda machucada?`,
    `-Eu tava comendo minha comida quando sentir uma presença muito forte,mas achei que era coisa da minha cabeça,quando houve essa explosão,surgiu uma gosma preta de uma bola que caiu do céu atravessando as nuvens,eu não sei o que tinha acontecido para a gosma preta ter saído da bola,mas quando ela saiu,ela foi engolindo rapidamente as árvores e venho na minha direção, perguntando “onde está Kevin?”`,
    `E eu falei que estava na cidade,aí a gosma não acreditou e arrancou meu braço Direito`,
    `E perguntou de novo,e eu respondi a mesma coisa,a gosma me jogou no chão e foi embora,e foi isso.`,
    `Kevin pergunta se ela sabe onde a gosma preta foi mas ela responde que não sabe.`
   ]},
  {id:"cap-3", title:"Capítulo 3 — 2ª parte do meio (Arco 2)", date:"24/11/2026",
   body:[
    `Após Kevin dar nome para gosma branca de HAGI,ele vai procurar onde a gosma preta foi,mas ele não foi sozinho,ele foi buscar em casa em casa companheiros para ir em viagem.`,
    `Kevin achou 4 participantes,Frank,July,Camile e .Emily,todos eles toparam participar por vingança,Kevin pensou na Ana,ele não quer que ela fique sozinha,Kevin acha Ana e pergunta se ela quer participar no grupo dele,Ana aceita,mas com uma condição,Dinheiro.`,
    `Agora são 5 membros no grupo,eles vão em busca da tal gosma preta,Kevin da o nome dessa gosma preta de Ginha,continuando a busca,todos sentem o chão tremer,o chão e substituído por areia, surge torres,cidades e aldeias,derrepente uma onda de areia cobre eles fazendo-os desmaiar.-ARCO 2`
   ]},
  {id:"cap-4", title:"Capítulo 4 — 3ª parte do meio (Arco 3)", date:"24/11/2026",
   body:[
    `Kevin acorda e ver todos os membrantes todos cheio de areia no nariz e na boca,ele acorda um por um,Frank pergunta o que aconteceu,Kevin responde da onda de areia,das torres,cidades e aldeias,July pergunta como aconteceu,mas Kevin responde que não sabe.`,
    `-Olha gente!Uma cidade ali na frente,vamos ver ce tem um abrigo.Disse Ana`,
    `O grupo de Kevin vai para cidade procurar abrigo,quando chegam Kevin pergunta para um morador cê tem um abrigo,Kevin percebeu algo diferente,alguns moradores não são humanos,são meio lobos.`,
    `-Temos sim!É 400 metros a Negi.Disse o morador`,
    `-O que é Negi?Pergunta Kevin para o morador`,
    `-Leste`,
    `-Valeu pela instrução!`,
    `Kevin fica surpresso ao ver que os pontos cardias são diferente,mas segue as instruções do morador,eles chegam no abrigo e bota seus equipamentos lá dentro,e vão perguntar novamente para um morador cê tem um lugar que compra equipamentos de defesa e onde fica,eles encontram novamente um morador e pergunta,que fala onde fica e segue as instruções.`,
    `Eles acham loja de equipamentos de defesa e compram com o que tem,quando eles estão voltando pro abrigo,alguma coisa solta pedaços da gosma preta que se chama Ginha voando pelo ar e caindo em partes da cidade,um pedaço cai em frente deles e Emily quiz tocar,mas Kevin tirou rapidamente a mão dela.`,
    `-É perigoso!Isso matou a sua família e a nossa.`,
    `Após Kevin dizer isso,viu uma coisa tomando forma de humano e saindo do pedaço da gosma,Kevin mata antes que saia,mas a gosma que foi morta se reproduziu e produziu mais formas humanas.`,
    `-DEFESA! Disse Kevin.`,
    `Todos matam a gosma,e bota algumas folhas para não reproduzir formas humanas da gosma por aí,eles voltam pra cidade e encontram a placa da cidade que eles não tinham visto,a cidade se chama Mesnek,quando eles entraram na cidade,viram muita gente infectada com a gosma e algumas tava se defendo por um tempo`,
    `-Eu vou pro sul com Emily para encorajar ela,e vocês ficam aqui no norte ajudando.Disse Kevin`,
    `-Mas cê não acha muito perigoso?Pergunta Ana`,
    `-Que nada!Eu sou forte e protejo ela.Disse Kevin`,
    `Chegando no sul da cidade,Emily e Kevin protege os moradores do sul da cidade,derrepente uma poça ali perto cai ali perto de Emily,a gosma formou rápido,mas Kevin faz um escudo do Hagi em volta deles,mas Kevin presta a total atenção na parte da frente do escudo,ele não presta atenção atrás,é uma coisa quebra um pouco do escudo e pega o braço esquerdo de Emily e morde.`,
    `-KEVIN!Eu senti uma mordida no meu braço e está doendo muito!Disse Emily gritando`,
    `Kevin após ouvir Emily,deixa o escudo,pega ela no colo e sai do escudo pulando chegando até o norte.`
   ]}
];
/* ========================================= */
var app=document.getElementById('app'),root=document.documentElement;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var th=store('theme');if(th)root.setAttribute('data-theme',th);
var fs=parseInt(store('fs'))||18;root.style.setProperty('--fs',fs+'px');
document.getElementById('theme').onclick=function(){
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  var n=dark?'light':'dark';root.setAttribute('data-theme',n);store('theme',n)};
function home(){
  document.title='A loucura do mistério? — Light Novel';app.replaceChildren();
  var h=el('section','hero');h.append(el('span','tag','Light Novel'),el('h1','','A loucura do mistério?'),el('p','','O garoto chamado Kevin e seus amigos enfrentam os problemas de Ginha e objetivos para impedir o fim do mundo.'));
  var l=el('div','list');app.append(h,el('h2','','Capítulos'),l);
  CHAPTERS.forEach(function(c){var a=el('a');a.href='#'+c.id;a.append(el('span','',c.title),el('small','',c.date||''));l.append(a)});
}
function reader(i){
  var c=CHAPTERS[i];document.title=c.title+' — A loucura do mistério?';app.replaceChildren();
  var t=el('div','tools'),x=el('button','exit','✕ Sair'),m=el('button','','A−'),p=el('button','','A+');
  function set(d){fs=Math.min(26,Math.max(14,fs+d));root.style.setProperty('--fs',fs+'px');store('fs',String(fs))}
  x.onclick=function(){location.hash=''};m.onclick=function(){set(-1)};p.onclick=function(){set(1)};t.append(x,m,p);
  var a=el('article');a.append(el('h1','',c.title));c.body.forEach(function(x){a.append(el('p','',x))});
  var n=el('nav','pn'),pr=el('a','',i>0?'← Anterior':'←'),ix=el('a','','Índice'),nx=el('a','',i<CHAPTERS.length-1?'Próximo →':'→');
  if(i>0)pr.href='#'+CHAPTERS[i-1].id;else pr.className='off';
  ix.href='#';
  if(i<CHAPTERS.length-1)nx.href='#'+CHAPTERS[i+1].id;else nx.className='off';
  n.append(pr,ix,nx);app.append(t,a,n);
}
var cur=null,tk=0;
function route(){
  var h=location.hash.slice(1),i=CHAPTERS.findIndex(function(c){return c.id===h});
  function show(){i>=0?reader(i):home();window.scrollTo(0,0)}
  if(cur===null||i===cur||matchMedia('(prefers-reduced-motion:reduce)').matches){cur=i;show();return}
  var d=i>cur?1:-1,t=++tk;cur=i;
  app.style.setProperty('--d',d);app.className='leave';
  setTimeout(function(){
    if(t!==tk)return;
    show();app.className='enter';void app.offsetWidth;app.className='';
  },240);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
